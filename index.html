<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #eceef1;
        color: #22262c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif;
        user-select: none;
      }

      #boot-splash .boot-mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #2f6ae0;
        color: #ffffff;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.04em;
        box-shadow: 0 12px 30px rgba(47, 106, 224, 0.28);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }

      #boot-splash .boot-title {
        margin-top: 2px;
        color: #5b6472;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      #boot-splash .boot-track {
        width: 220px;
        height: 4px;
        margin-top: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #d8dbe0;
      }

      #boot-splash .boot-track span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #2f6ae0;
        animation: boot-slide 1.1s ease-in-out infinite;
      }

      #boot-splash .boot-note {
        color: #8b93a1;
        font-size: 11px;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.06);
          opacity: 1;
        }
      }

      @keyframes boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: #101216;
          color: #d9dde3;
        }

        #boot-splash .boot-mark {
          background: #7aa2ff;
          color: #101216;
        }

        #boot-splash .boot-title {
          color: #9aa3b2;
        }

        #boot-splash .boot-track {
          background: #34383f;
        }

        #boot-splash .boot-note {
          color: #6f7887;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="boot-splash" aria-hidden="true">
        <div class="boot-mark">N</div>
        <div class="boot-title">Note</div>
        <div class="boot-track"><span></span></div>
        <div class="boot-note">正在启动…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
